name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # test:coverage runs the full suite and enforces the thresholds in
      # jest.config.js, so a separate `npm test` step would only run it twice.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 20
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build-docker:
    name: Build Docker Image and Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: cheery-scrapio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment smoke test: boot the image we just built exactly as a
      # deployment would and check that the app actually serves traffic.
      # Only DB-free routes are probed -- there is no MongoDB in CI, and
      # Mongoose would buffer a DB query for ~10s before failing, which
      # would make this fail for the wrong reason.
      - name: Start container
        run: |
          docker run -d --name smoke \
            -p 5000:5000 \
            -e NODE_ENV=production \
            -e PORT=5000 \
            cheery-scrapio:latest

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "App responded after ${i}s"
              exit 0
            fi
            if ! docker ps --filter name=smoke --filter status=running -q | grep -q .; then
              echo "::error::Container exited before serving traffic"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          echo "::error::App did not respond on /health within 30s"
          docker logs smoke
          exit 1

      - name: Smoke test GET /health
        run: |
          body=$(curl -fsS http://localhost:5000/health)
          echo "Response: $body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::/health did not report status ok"
            exit 1
          }

      - name: Smoke test GET / renders the page
        run: |
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' http://localhost:5000/)
          echo "GET / -> HTTP $code"
          test "$code" = "200" || {
            echo "::error::GET / returned HTTP $code, expected 200"
            docker logs smoke
            exit 1
          }
          test -s /tmp/home.html || {
            echo "::error::GET / returned an empty body"
            exit 1
          }

      - name: Smoke test unknown route returns 404
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/definitely-not-a-route)
          echo "GET /definitely-not-a-route -> HTTP $code"
          test "$code" = "404" || {
            echo "::error::Unknown route returned HTTP $code, expected 404"
            exit 1
          }

      - name: Show container logs
        if: always()
        run: docker logs smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, security-audit, build-docker]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.lint-and-format.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build-docker.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
